services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Run setup first}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
